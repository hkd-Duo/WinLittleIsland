name: 发布正式版

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.6.67）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 解析版本并校验发行文件
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap { "::error title=发布校验失败::$($_.Exception.Message)"; throw }
          $event = '${{ github.event_name }}'
          $ref = '${{ github.ref }}'
          $tag = ''
          if ($event -ceq 'workflow_dispatch') { $tag = '${{ inputs.tag }}' }
          elseif ($ref -like 'refs/tags/*') { $tag = '${{ github.ref_name }}' }
          $cargoVersion = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value).Trim()
          if (-not $tag) {
            $tag = "v$cargoVersion"
            $found = @(git ls-remote --tags origin "refs/tags/$tag" 2>$null)
            if ($LASTEXITCODE -ne 0 -or $found.Count -eq 0) { "release=false" >> $env:GITHUB_OUTPUT; "tag $tag 尚未创建，跳过发布"; exit 0 }
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "无效的 tag：$tag" }
          $version = $tag.Substring(1)
          if ($cargoVersion -ne $version) { throw "Cargo.toml 版本 $cargoVersion 与 tag $tag 不一致" }
          $directory = Join-Path $PWD "release/$tag"
          if (-not (Test-Path -LiteralPath $directory)) { "release=false" >> $env:GITHUB_OUTPUT; "release/$tag 不存在，跳过发布"; exit 0 }
          $expected = @(
            "WinLittleIsland-Setup-$tag-x64.exe",
            "WinLittleIsland-$tag-windows-x64.zip",
            'SHA256SUMS.txt'
          )
          $actual = @(Get-ChildItem -LiteralPath $directory -File | ForEach-Object { $_.Name })
          if ((($actual | Sort-Object) -join '|') -ne (($expected | Sort-Object) -join '|')) { throw "release/$tag 文件不符合约定：$($actual -join ', ')" }
          foreach ($line in Get-Content -LiteralPath (Join-Path $directory 'SHA256SUMS.txt')) {
            if ($line -notmatch '^([0-9a-f]{64})  (\S+)$') { throw "SHA256SUMS.txt 格式异常：$line" }
            $hash = $Matches[1]; $name = $Matches[2]
            $file = Join-Path $directory $name
            if (-not (Test-Path -LiteralPath $file)) { throw "SHA256SUMS.txt 引用了不存在的文件：$name" }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw "文件校验失败：$name" }
          }
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i].Trim() -ceq "## v$version") { $start = $i; break } }
          if ($start -lt 0) { throw "CHANGELOG.md 缺少 ## v$version 段落" }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## v') { break }
            $body.Add($lines[$i])
          }
          $notes = ($body -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) { throw '发行说明为空' }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'release-notes.md'), $notes, [Text.UTF8Encoding]::new($false))
          "release=true" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: 创建或更新 Release
        if: steps.meta.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          trap { "::error title=发布失败::$($_.Exception.Message)"; throw }
          $tag = '${{ steps.meta.outputs.tag }}'
          $event = '${{ github.event_name }}'
          $ref = '${{ github.ref }}'
          $directory = Join-Path $PWD "release/$tag"
          $assets = @(Get-ChildItem -LiteralPath $directory -File | ForEach-Object { $_.FullName })
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          # 并发触发（推送 main 与推送 tag 同时跑）时 Release 可能已被另一条流水线创建，
          # 先尝试创建，失败则视为已存在，改为覆盖上传资产并更新说明。
          gh release create $tag @assets --verify-tag --title "WinLittleIsland $tag" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) {
            if ($event -ceq 'push' -and $ref -like 'refs/heads/*') { "已发布过 $tag，仅同步资产与说明"; }
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "WinLittleIsland $tag" --notes-file $notes --latest
          }
